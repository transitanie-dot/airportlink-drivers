<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Airportlink Drivers</title>
  <style>
    :root {
      --navy: #333B50;
      --bg: #E8EBE7;
      --text: #111827;
      --muted: #6B7280;
      --white: #FFFFFF;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    main {
      width: min(100%, 620px);
      padding: 48px 32px;
      border-radius: 24px;
      text-align: center;
      background: var(--white);
      box-shadow: 0 18px 45px rgba(16, 24, 40, 0.10);
    }

    .brand {
      color: var(--navy);
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -0.8px;
    }

    h1 {
      margin: 28px 0 12px;
      font-size: 32px;
      color: var(--navy);
    }

    p {
      margin: 0 auto;
      max-width: 440px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.6;
    }

    .status {
      display: inline-block;
      margin-top: 26px;
      padding: 10px 14px;
      border-radius: 999px;
      background: #ECFDF5;
      color: #047857;
      font-size: 14px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <div class="brand">AIRPORTLINK</div>
    <h1>Driver Partner Portal</h1>
    <p>
      The Airportlink portal for drivers and transport partners is being prepared.
    </p>
    <div class="status">Coming soon</div>
  </main>
</body>
</html>
